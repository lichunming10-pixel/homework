<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖公會蔡功譜中學 - 學生欠交功課統計系統 (家課版)</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --danger-color: #e06c75;
            --warning-color: #f39c12;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 950px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 24px;
            margin-bottom: 24px;
            position: relative;
        }
        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .form-group {
            flex: 1;
            min-width: 200px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="date"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea {
            height: 120px;
            resize: vertical;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #357abd;
        }
        .filter-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            background: #eef2f7;
            padding: 15px;
            border-radius: 6px;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 240px;
        }
        .filter-group label {
            margin-bottom: 0;
            white-space: nowrap;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            text-align: left;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #eeeeee;
        }
        th {
            background-color: #f8f9fa;
            color: #555;
        }
        .badge {
            background-color: #e1f0fe;
            color: var(--primary-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-delete {
            background-color: var(--danger-color);
            padding: 6px 12px;
            font-size: 14px;
            width: auto;
        }
        .btn-delete:hover {
            background-color: #d15a63;
        }
        .btn-export, .btn-backup, .btn-restore {
            width: auto;
            padding: 8px 16px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-export { background-color: var(--success-color); }
        .btn-export:hover { background-color: #27ae60; }
        .btn-backup { background-color: #9b59b6; }
        .btn-backup:hover { background-color: #8e44ad; }
        .btn-restore { background-color: #34495e; }
        .btn-restore:hover { background-color: #2c3e50; }
        .btn-toggle {
            background-color: #6c757d;
            font-size: 14px;
            padding: 8px 16px;
            width: auto;
        }
        .no-data {
            text-align: center;
            color: #888;
            padding: 20px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
            color: #555;
            flex-wrap: wrap;
            gap: 10px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .clean-alert {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 8px;
            border: 1px solid #ffeeba;
        }
        .roster-card {
            background: #f8f9fa;
            border: 1px dashed var(--primary-color);
            display: none;
            margin-top: 15px;
        }
        .manage-class-box {
            display: flex; 
            gap: 10px; 
            background: #e9ecef; 
            padding: 10px; 
            border-radius: 4px;
            align-items: center;
            margin-bottom: 15px;
        }
        /* 📅 家課展示板專屬樣式 */
        .homework-display-card {
            background: #fffdf0;
            border: 1px solid #ffe58f;
            border-left: 5px solid var(--warning-color);
        }
        .homework-list {
            margin: 10px 0;
            padding-left: 20px;
            line-height: 1.8;
            font-size: 16px;
        }
        .homework-list li {
            margin-bottom: 5px;
        }
        .btn-copy {
            background-color: var(--warning-color);
            width: auto;
            padding: 6px 12px;
            font-size: 14px;
            float: right;
        }
        .btn-copy:hover {
            background-color: #e08e0b;
        }
        .homework-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #ffe58f;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏫 聖公會蔡功譜中學</h1>
        <h2>📝 學生欠交功課統計系統 (家課結合版)</h2>
        <p>自訂班別與名單、無伺服器保密、支援一鍵備份與匯出</p>
    </header>

    <div id="cleanAlert" class="clean-alert">
        ⚠️ <strong>系統通知：</strong> 系統已自動為您清除 <span id="cleanedCount">0</span> 筆過期的記錄！
    </div>

    <!-- 頂部按鈕：控制展開「班別與名單管理」 -->
    <div style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
        <button id="toggleRosterBtn" class="btn-toggle">⚙️ 管理班別與學生名冊</button>
    </div>

    <!-- 班別與學生名單管理區塊 -->
    <div id="rosterCard" class="card roster-card">
        <h3>👥 班別與學生名冊管理</h3>
        
        <div class="manage-class-box">
            <strong style="white-space: nowrap;">✨ 新增班別：</strong>
            <input type="text" id="newClassInput" placeholder="例如：4A" style="width: 150px; padding: 6px;">
            <button id="addClassBtn" style="width: auto; padding: 6px 15px; background: #28a745;">加入</button>
        </div>
        <p style="font-size: 14px; color: #666; margin-top: 10px;">請選擇班別以「編輯學生名單」或「刪除該班別」：</p>
        
        <div class="form-row">
            <div class="form-group" style="flex: 1;">
                <label for="rosterClassSelect">選擇班別</label>
                <select id="rosterClassSelect"></select>
                <button id="deleteClassBtn" class="btn-delete" style="margin-top: 10px; width: 100%;">🗑️ 刪除此班別</button>
            </div>
            <div class="form-group" style="flex: 3;">
                <label for="rosterTextArea">該班學生名單（每行一人）</label>
                <textarea id="rosterTextArea" placeholder="請先在左側選擇班別，然後在此貼上名字..."></textarea>
            </div>
        </div>
        
        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px;">
            <button id="saveRosterBtn" style="width: auto; background-color: var(--primary-color);">💾 儲存該班名單</button>
            <button id="closeRosterBtn" style="width: auto; background-color: #6c757d;">收起設定</button>
        </div>
    </div>

    <!-- 📅 每日家課（功課）展示板 -->
    <div class="card homework-display-card">
        <div class="homework-header">
            <h3 style="margin: 0; color: #b78103;">📅 每日家課（功課）展示板</h3>
            <button id="copyHomeworkBtn" class="btn-copy">📋 一鍵複製家課</button>
        </div>
        <div style="font-size: 15px; font-weight: bold; color: #666; margin-bottom: 10px;">
            班別：<span id="hwDisplayClass" class="badge" style="background-color: #ffe58f; color: #b78103;">-</span> 
            &nbsp;&nbsp;&nbsp;&nbsp;
            日期：<span id="hwDisplayDate" style="color: #333;">-</span>
        </div>
        <div id="noHomeworkMessage" class="no-data" style="color: #9e7403; background: none; padding: 10px;">此班級當天暫無發佈家課 👍</div>
        <ol id="homeworkDisplayList" class="homework-list" style="display: none;"></ol>
    </div>

    <!-- 📝 發佈每日家課表單 -->
    <div class="card" style="border-top: 4px solid var(--warning-color);">
        <h3 style="color: #d48806;">📝 發佈每日家課</h3>
        <form id="dailyHomeworkForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="homeworkDate">發佈日期</label>
                    <input type="date" id="homeworkDate" required>
                </div>
                <div class="form-group">
                    <label for="homeworkClassSelect">發佈班別</label>
                    <select id="homeworkClassSelect" required>
                        <option value="" disabled selected>請選擇班別</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="homeworkContent">家課（功課）內容（支援換行）</label>
                <textarea id="homeworkContent" placeholder="例如：&#10;1. 中文工作紙 (三)&#10;2. 數學書 P.12 習題" required></textarea>
            </div>
            <button type="submit" style="background-color: var(--warning-color);">💾 發佈並儲存家課</button>
        </form>
    </div>

    <!-- ➕ 輸入欠交表單 -->
    <div class="card">
        <h3>➕ 新增欠交記錄</h3>
        <form id="recordForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="recordDate">登記日期</label>
                    <input type="date" id="recordDate" required>
                </div>
                <div class="form-group">
                    <label for="studentClass">班別</label>
                    <select id="studentClass" required>
                        <option value="" disabled selected>請選擇班別</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="studentNameSelect">學生姓名</label>
                    <select id="studentNameSelect" required>
                        <option value="" disabled selected>請先選擇班別</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 2;">
                    <label for="homeworkItem">欠交項目</label>
                    <input type="text" id="homeworkItem" placeholder="例如：中文工作紙 (三)" required>
                </div>
            </div>
            <button type="submit">儲存記錄</button>
        </form>
    </div>

    <!-- 📋 數據顯示列表 -->
    <div class="card">
        <h3>📋 欠交功課列表</h3>
        <div class="filter-section">
            <div class="filter-group">
                <label for="classFilter">🔍 班別：</label>
                <select id="classFilter">
                    <option value="ALL">顯示所有班別</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="nameSearch">👤 姓名搜尋：</label>
                <input type="text" id="nameSearch" placeholder="請輸入姓名關鍵字...">
            </div>
            <div class="filter-group">
                <label for="cleanPolicy">📅 歷史數據保留：</label>
                <select id="cleanPolicy">
                    <option value="7">只保留最近 7 天 (按週)</option>
                    <option value="30" selected>只保留最近 30 天 (按月)</option>
                    <option value="90">只保留最近 90 天 (按季)</option>
                    <option value="NEVER">不自動清除 (永久保留)</option>
                </select>
            </div>
        </div>
        <div class="stats-bar">
            <span id="totalCount">總計欠交：0 筆</span>
            <div class="action-buttons">
                <button id="exportBtn" class="btn-export">📥 匯出 Excel 報表</button>
                <button id="exportBackupBtn" class="btn-backup">📤 導出數據備份</button>
                <button id="importBackupBtn" class="btn-restore">📥 導入數據備份</button>
                <input type="file" id="fileInput" accept=".json" style="display: none;">
                <button id="clearAllBtn" class="btn-delete" style="width: auto; padding: 5px 10px;">清除所有數據</button>
            </div>
        </div>
        
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 20%">時間</th>
                        <th style="width: 15%">班別</th>
                        <th style="width: 20%">學生姓名</th>
                        <th style="width: 30%">欠交項目</th>
                        <th style="width: 15%">操作</th>
                    </tr>
                </thead>
                <tbody id="recordTableBody">
                </tbody>
            </table>
            <div id="noDataMessage" class="no-data">目前沒有符合篩選或搜尋條件的記錄 👍</div>
        </div>
    </div>
</div>

<script>
    // 【防呆防錯機制】使用 try...catch 讀取本地資料，避免舊版錯誤格式導致網頁當機
    let records = [];
    let studentRosters = {};
    let dailyHomeworkDb = {};
    let classList = [];
    
    try { records = JSON.parse(localStorage.getItem('homeworkRecords')) || []; } catch(e) { records = []; }
    try { studentRosters = JSON.parse(localStorage.getItem('studentRosters')) || {}; } catch(e) { studentRosters = {}; }
    try { dailyHomeworkDb = JSON.parse(localStorage.getItem('dailyHomeworkDb')) || {}; } catch(e) { dailyHomeworkDb = {}; }
    try { 
        classList = JSON.parse(localStorage.getItem('homeworkClasses'));
        if (!Array.isArray(classList) || classList.length === 0) {
            classList = ['1A', '1B', '1C', '2A', '2B', '2C', '3A', '3B', '3C'];
        }
    } catch(e) { 
        classList = ['1A', '1B', '1C', '2A', '2B', '2C', '3A', '3B', '3C']; 
    }

    let savedPolicy = localStorage.getItem('homeworkCleanPolicy') || "30";

    // 獲取 DOM 元素
    const recordForm = document.getElementById('recordForm');
    const recordDateInput = document.getElementById('recordDate');
    const studentClassInput = document.getElementById('studentClass');
    const studentNameSelect = document.getElementById('studentNameSelect');
    const homeworkItemInput = document.getElementById('homeworkItem');
    const classFilter = document.getElementById('classFilter');
    const nameSearch = document.getElementById('nameSearch');
    const cleanPolicy = document.getElementById('cleanPolicy');
    const cleanAlert = document.getElementById('cleanAlert');
    const cleanedCountSpan = document.getElementById('cleanedCount');
    const recordTableBody = document.getElementById('recordTableBody');
    const noDataMessage = document.getElementById('noDataMessage');
    const totalCountSpan = document.getElementById('totalCount');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const exportBtn = document.getElementById('exportBtn');
    const exportBackupBtn = document.getElementById('exportBackupBtn');
    const importBackupBtn = document.getElementById('importBackupBtn');
    const fileInput = document.getElementById('fileInput');

    const toggleRosterBtn = document.getElementById('toggleRosterBtn');
    const rosterCard = document.getElementById('rosterCard');
    const rosterClassSelect = document.getElementById('rosterClassSelect');
    const rosterTextArea = document.getElementById('rosterTextArea');
    const saveRosterBtn = document.getElementById('saveRosterBtn');
    const closeRosterBtn = document.getElementById('closeRosterBtn');
    const newClassInput = document.getElementById('newClassInput');
    const addClassBtn = document.getElementById('addClassBtn');
    const deleteClassBtn = document.getElementById('deleteClassBtn');

    const dailyHomeworkForm = document.getElementById('dailyHomeworkForm');
    const homeworkDateInput = document.getElementById('homeworkDate');
    const homeworkClassSelect = document.getElementById('homeworkClassSelect');
    const homeworkContentInput = document.getElementById('homeworkContent');
    const hwDisplayClass = document.getElementById('hwDisplayClass');
    const hwDisplayDate = document.getElementById('hwDisplayDate');
    const noHomeworkMessage = document.getElementById('noHomeworkMessage');
    const homeworkDisplayList = document.getElementById('homeworkDisplayList');
    const copyHomeworkBtn = document.getElementById('copyHomeworkBtn');

    // 預設日期
    const today = new Date().toISOString().split('T')[0];
    if (recordDateInput) recordDateInput.value = today;
    if (homeworkDateInput) homeworkDateInput.value = to
