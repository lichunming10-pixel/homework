<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖公會蔡功譜中學 - 學生欠交功課統計系統 (全動態版)</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --danger-color: #e06c75;
            --warning-color: #f39c12;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 950px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 24px;
            margin-bottom: 24px;
            position: relative;
        }
        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .form-group {
            flex: 1;
            min-width: 200px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="date"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea {
            height: 120px;
            resize: vertical;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #357abd;
        }
        .filter-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            background: #eef2f7;
            padding: 15px;
            border-radius: 6px;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 240px;
        }
        .filter-group label {
            margin-bottom: 0;
            white-space: nowrap;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            text-align: left;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #eeeeee;
        }
        th {
            background-color: #f8f9fa;
            color: #555;
        }
        .badge {
            background-color: #e1f0fe;
            color: var(--primary-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-delete {
            background-color: var(--danger-color);
            padding: 6px 12px;
            font-size: 14px;
            width: auto;
        }
        .btn-delete:hover {
            background-color: #d15a63;
        }
        .btn-export {
            background-color: var(--success-color);
            width: auto;
            padding: 8px 16px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-export:hover {
            background-color: #27ae60;
        }
        .btn-backup {
            background-color: #9b59b6;
            width: auto;
            padding: 8px 16px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-backup:hover {
            background-color: #8e44ad;
        }
        .btn-restore {
            background-color: #34495e;
            width: auto;
            padding: 8px 16px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-restore:hover {
            background-color: #2c3e50;
        }
        .btn-toggle {
            background-color: #6c757d;
            font-size: 14px;
            padding: 8px 16px;
            width: auto;
        }
        .no-data {
            text-align: center;
            color: #888;
            padding: 20px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
            color: #555;
            flex-wrap: wrap;
            gap: 10px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .clean-alert {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 8px;
            border: 1px solid #ffeeba;
        }
        .roster-card {
            background: #f8f9fa;
            border: 1px dashed var(--primary-color);
            display: none;
            margin-top: 15px;
        }
        .manage-class-box {
            display: flex; 
            gap: 10px; 
            background: #e9ecef; 
            padding: 10px; 
            border-radius: 4px;
            align-items: center;
            margin-bottom: 15px;
        }

        /* 📅 新增家課部分專屬樣式 */
        .homework-display-card {
            background: #fffdf0;
            border: 1px solid #ffe58f;
            border-left: 5px solid var(--warning-color);
        }
        .homework-list {
            margin: 10px 0;
            padding-left: 20px;
            line-height: 1.8;
            font-size: 16px;
        }
        .homework-list li {
            margin-bottom: 5px;
        }
        .btn-copy {
            background-color: var(--warning-color);
            width: auto;
            padding: 6px 12px;
            font-size: 14px;
            float: right;
        }
        .btn-copy:hover {
            background-color: #e08e0b;
        }
        .homework-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #ffe58f;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏫 聖公會蔡功譜中學</h1>
        <h2>📝 學生欠交功課統計系統 (全動態版)</h2>
        <p>自訂班別與名單、無伺服器保密、支援一鍵備份與匯出</p>
    </header>

    <!-- 自動清理通知欄 -->
    <div id="cleanAlert" class="clean-alert">
        ⚠️ <strong>系統通知：</strong> 系統已自動為您清除 <span id="cleanedCount">0</span> 筆過期的本地記錄！
    </div>

    <!-- 頂部按鈕：控制展開「班別與名單管理」 -->
    <div style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
        <button id="toggleRosterBtn" class="btn-toggle">⚙️ 管理班別與學生名冊</button>
    </div>

    <!-- 班別與學生名單管理區塊 -->
    <div id="rosterCard" class="card roster-card">
        <h3>👥 班別與學生名冊管理</h3>
        
        <!-- 新增班別區塊 -->
        <div class="manage-class-box">
            <strong style="white-space: nowrap;">✨ 新增班別：</strong>
            <input type="text" id="newClassInput" placeholder="例如：4A" style="width: 150px; padding: 6px;">
            <button id="addClassBtn" style="width: auto; padding: 6px 15px; background: #28a745;">加入</button>
        </div>
        <p style="font-size: 14px; color: #666; margin-top: 10px;">請選擇班別以「編輯學生名單」或「刪除該班別」：</p>
        
        <div class="form-row">
            <div class="form-group" style="flex: 1;">
                <label for="rosterClassSelect">選擇班別</label>
                <select id="rosterClassSelect">
                    <!-- JavaScript 動態載入 -->
                </select>
                <button id="deleteClassBtn" class="btn-delete" style="margin-top: 10px; width: 100%;">🗑️ 刪除此班別</button>
            </div>
            <div class="form-group" style="flex: 3;">
                <label for="rosterTextArea">該班學生名單（每行一人）</label>
                <textarea id="rosterTextArea" placeholder="請先在左側選擇班別，然後在此貼上名字..."></textarea>
            </div>
        </div>
        
        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px;">
            <button id="saveRosterBtn" style="width: auto; background-color: var(--primary-color);">💾 儲存該班名單</button>
            <button id="closeRosterBtn" style="width: auto; background-color: #6c757d;">收起設定</button>
        </div>
    </div>

    <!-- 📅 【新增部分】：每日家課（功課）展示板 -->
    <div class="card homework-display-card">
        <div class="homework-header">
            <h3 style="margin: 0; color: #b78103; display: flex; align-items: center; gap: 8px;">📅 每日家課（功課）展示板</h3>
            <button id="copyHomeworkBtn" class="btn-copy">📋 一鍵複製家課</button>
        </div>
        <div style="font-size: 15px; font-weight: bold; color: #666; margin-bottom: 10px;">
            班別：<span id="hwDisplayClass" class="badge" style="background-color: #ffe58f; color: #b78103; font-size: 15px;">-</span> 
            &nbsp;&nbsp;&nbsp;&nbsp;
            日期：<span id="hwDisplayDate" style="color: #333;">-</span>
        </div>
        <div id="noHomeworkMessage" class="no-data" style="color: #9e7403; background: none; padding: 10px;">今天此班級暫無發佈家課 👍</div>
        <ol id="homeworkDisplayList" class="homework-list" style="display: none;">
            <!-- JavaScript 動態插入家課項目 -->
        </ol>
    </div>

    <!-- 【新增部分】：輸入每天家課（功課）表單 -->
    <div class="card" style="border-top: 4px solid var(--warning-color);">
        <h3 style="color: #d48806;">📝 發佈每日家課</h3>
        <form id="dailyHomeworkForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="homeworkDate">發佈日期</label>
                    <input type="date" id="homeworkDate" required>
                </div>
                <div class="form-group">
                    <label for="homeworkClassSelect">發佈班別</label>
                    <select id="homeworkClassSelect" required>
                        <option value="" disabled selected>請選擇班別</option>
                        <!-- JavaScript 動態載入 -->
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="homeworkContent">家課（功課）內容（每行一項功課，支援換行）</label>
                <textarea id="homeworkContent" placeholder="例如：&#10;1. 中文工作紙 (三)&#10;2. 數學書 P.12 習題 1-5&#10;3. 溫習英文單詞 Unit 2" required></textarea>
            </div>
            <button type="submit" style="background-color: var(--warning-color);">💾 發佈並儲存家課</button>
        </form>
    </div>

    <!-- 輸入表單 -->
    <div class="card">
        <h3>➕ 新增欠交記錄</h3>
        <form id="recordForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="recordDate">登記日期</label>
                    <input type="date" id="recordDate" required>
                </div>
                <div class="form-group">
                    <label for="studentClass">班別</label>
                    <select id="studentClass" required>
                        <option value="" disabled selected>請選擇班別</option>
                        <!-- JavaScript 動態載入 -->
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="studentNameSelect">學生姓名</label>
                    <select id="studentNameSelect" required>
                        <option value="" disabled selected>請先選擇班別</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 2;">
                    <label for="homeworkItem">欠交項目</label>
                    <input type="text" id="homeworkItem" placeholder="例如：中文工作紙 (三)、數學書 P.12" required>
                </div>
            </div>
            <button type="submit">儲存記錄</button>
        </form>
    </div>

    <!-- 數據顯示列表 -->
    <div class="card">
        <h3>📋 欠交功課列表</h3>
        <div class="filter-section">
            <div class="filter-group">
                <label for="classFilter">🔍 班別：</label>
                <select id="classFilter">
                    <option value="ALL">顯示所有班別</option>
                    <!-- JavaScript 動態載入 -->
                </select>
            </div>
            <div class="filter-group">
                <label for="nameSearch">👤 姓名搜尋：</label>
                <input type="text" id="nameSearch" placeholder="請輸入姓名關鍵字...">
            </div>
            <div class="filter-group">
                <label for="cleanPolicy">📅 歷史數據保留：</label>
                <select id="cleanPolicy">
                    <option value="7">只保留最近 7 天 (按週)</option>
                    <option value="30" selected>只保留最近 30 天 (按月)</option>
                    <option value="90">只保留最近 90 天 (按季)</option>
                    <option value="NEVER">不自動清除 (永久保留)</option>
                </select>
            </div>
        </div>
        <div class="stats-bar">
            <span id="totalCount">總計欠交：0 筆</span>
            <div class="action-buttons">
                <button id="exportBtn" class="btn-export">📥 匯出 Excel 報表</button>
                <button id="exportBackupBtn" class="btn-backup">📤 導出數據備份</button>
                <button id="importBackupBtn" class="btn-restore">📥 導入數據備份</button>
                <input type="file" id="fileInput" accept=".json" style="display: none;">
                <button id="clearAllBtn" class="btn-delete" style="width: auto; padding: 5px 10px;">清除所有數據</button>
            </div>
        </div>
        
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 20%">時間</th>
                        <th style="width: 15%">班別</th>
                        <th style="width: 20%">學生姓名</th>
                        <th style="width: 30%">欠交項目</th>
                        <th style="width: 15%">操作</th>
                    </tr>
                </thead>
                <tbody id="recordTableBody">
                </tbody>
            </table>
            <div id="noDataMessage" class="no-data">目前沒有符合篩選或搜尋條件的記錄 👍</div>
        </div>
    </div>
</div>

<script>
    // 初始化 DOM 元素
    const recordForm = document.getElementById('recordForm');
    const recordDateInput = document.getElementById('recordDate');
    const studentClassInput = document.getElementById('studentClass');
    const studentNameSelect = document.getElementById('studentNameSelect');
    const homeworkItemInput = document.getElementById('homeworkItem');
    const classFilter = document.getElementById('classFilter');
    const nameSearch = document.getElementById('nameSearch');
    const cleanPolicy = document.getElementById('cleanPolicy');
    const cleanAlert = document.getElementById('cleanAlert');
    const cleanedCountSpan = document.getElementById('cleanedCount');
    const recordTableBody = document.getElementById('recordTableBody');
    const noDataMessage = document.getElementById('noDataMessage');
    const totalCountSpan = document.getElementById('totalCount');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const exportBtn = document.getElementById('exportBtn');
    const exportBackupBtn = document.getElementById('exportBackupBtn');
    const importBackupBtn = document.getElementById('importBackupBtn');
    const fileInput = document.getElementById('fileInput');

    // 名單管理 DOM
    const toggleRosterBtn = document.getElementById('toggleRosterBtn');
    const rosterCard = document.getElementById('rosterCard');
    const rosterClassSelect = document.getElementById('rosterClassSelect');
    const rosterTextArea = document.getElementById('rosterTextArea');
    const saveRosterBtn = document.getElementById('saveRosterBtn');
    const closeRosterBtn = document.getElementById('closeRosterBtn');
    const newClassInput = document.getElementById('newClassInput');
    const addClassBtn = document.getElementById('addClassBtn');
    const deleteClassBtn = document.getElementById('deleteClassBtn');

    // 📅 【新增家課功能】 DOM 元素
    const dailyHomeworkForm = document.getElementById('dailyHomeworkForm');
    const homeworkDateInput = document.getElementById('homeworkDate');
    const homeworkClassSelect = document.getElementById('homeworkClassSelect');
    const homeworkContentInput = document.getElementById('homeworkContent');
    
    const hwDisplayClass = document.getElementById('hwDisplayClass');
    const hwDisplayDate = document.getElementById('hwDisplayDate');
    const noHomeworkMessage = document.getElementById('noHomeworkMessage');
    const homeworkDisplayList = document.getElementById('homeworkDisplayList');
    const copyHomeworkBtn = document.getElementById('copyHomeworkBtn');

    // 設定預設日期為今天
    const today = new Date().toISOString().split('T')[0];
    recordDateInput.value = today;
    homeworkDateInput.value = today; // 發佈家課日期也預設為今天

    // 從 localStorage 讀取核心資料
    let records = JSON.parse(localStorage.getItem('homeworkRecords')) || [];
    let savedPolicy = localStorage.getItem('homeworkCleanPolicy') || "30";
    cleanPolicy.value = savedPolicy;
    let studentRosters = JSON.parse(localStorage.getItem('studentRosters')) || {};
    
    // 📅 【新增家課功能】 讀取家課數據資料庫 (格式: { "2026-09-22___1A": ["1. 中文工作紙", "2. 英文書"] })
    let dailyHomeworkDb = JSON.parse(localStorage.getItem('dailyHomeworkDb')) || {};

    // 預設班別列表
    let classList = JSON.parse(localStorage.getItem('homeworkClasses')) || ['1A', '1B', '1C', '2A', '2B', '2C', '3A', '3B', '3C'];

    // ==========================================
    // 🏫 動態班別渲染邏輯
    // ==========================================
    function renderClassDropdowns() {
        // 1. 登記表單的班別
        let recordClassHtml = '<option value="" disabled selected>請選擇班別</option>';
        classList.forEach(cls => { recordClassHtml += `<option value="${cls}">${cls}</option>`; });
        
        // 為了避免重新渲染時遺失已選的選項
        const currentRecordClass = studentClassInput.value;
        studentClassInput.innerHTML = recordClassHtml;
        if (classList.includes(currentRecordClass)) studentClassInput.value = currentRecordClass;

        // 📅 【新增家課功能】：家課表單的班別
        let hwFormClassHtml = '<option value="" disabled selected>請選擇班別</option>';
        classList.forEach(cls => { hwFormClassHtml += `<option value="${cls}">${cls}</option>`; });
        const currentHwFormClass = homeworkClassSelect.value;
        homeworkClassSelect.innerHTML = hwFormClassHtml;
        if (classList.includes(currentHwFormClass)) homeworkClassSelect.value = currentHwFormClass;

        // 2. 篩選器的班別
        let filterClassHtml = '<option value="ALL">顯示所有班別</option>';
        classList.forEach(cls => { filterClassHtml += `<option value="${cls}">${cls}</option>`; });
        
        const currentFilterClass = classFilter.value;
        classFilter.innerHTML = filterClassHtml;
        if (currentFilterClass === 'ALL' || classList.includes(currentFilterClass)) {
            classFilter.value = currentFilterClass;
        }

        // 3. 設定區塊的班別
        let rosterClassHtml = '';
        if (classList.length === 0) {
            rosterClassHtml = '<option value="" disabled selected>請先新增班別</option>';
        } else {
            classList.forEach(cls => { rosterClassHtml += `<option value="${cls}">${cls}</option>`; });
        }
        
        const currentRosterClass = rosterClassSelect.value;
        rosterClassSelect.innerHTML = rosterClassHtml;
        if (classList.includes(currentRosterClass)) rosterClassSelect.value = currentRosterClass;
    }

    // ==========================================
    // ⚙️ 管理班別與名單
    // ==========================================
    toggleRosterBtn.addEventListener('click', () => {
        rosterCard.style.display = rosterCard.style.display === 'block' ? 'none' : 'block';
        loadRosterToTextarea();
    });

    closeRosterBtn.addEventListener('click', () => {
        rosterCard.style.display = 'none';
    });

    // 新增班別
    addClassBtn.addEventListener('click', () => {
        const newClass = newClassInput.value.trim().toUpperCase(); // 統一轉大寫，如 4a -> 4A
        if (!newClass) return alert('請輸入班別名稱！');
        if (classList.includes(newClass)) return alert('此班別已經存在！');
        
        classList.push(newClass);
        classList.sort(); 
        
        localStorage.setItem('homeworkClasses', JSON.stringify(classList));
        newClassInput.value = '';
        
        renderClassDropdowns();
        rosterClassSelect.value = newClass; // 自動跳轉到剛新增的班級
        loadRosterToTextarea();
        alert(`成功新增班別：${newClass}`);
    });

    // 刪除班別
    deleteClassBtn.addEventListener('click', () => {
        const targetClass = rosterClassSelect.value;
        if (!targetClass) return;
        if (confirm(`⚠️ 警告：確定要刪除「${targetClass}」班嗎？\n刪除後，該班的學生名單設定將被清除（但已登記的欠交記錄仍會保留）。`)) {
            classList = classList.filter(cls => cls !== targetClass);
            delete studentRosters[targetClass]; // 清除該班名單
            
            localStorage.setItem('homeworkClasses', JSON.stringify(classList));
            localStorage.setItem('studentRosters', JSON.stringify(studentRosters));
            
            renderClassDropdowns();
            loadRosterToTextarea();
            updateStudentDropdown();
        }
    });

    rosterClassSelect.addEventListener('change', loadRosterToTextarea);

    function loadRosterToTextarea() {
        const cls = rosterClassSelect.value;
        if (!cls) {
            rosterTextArea.value = '';
            return;
        }
        const list = studentRosters[cls] || [];
        rosterTextArea.value = list.join('\n');
    }

    saveRosterBtn.addEventListener('click', () => {
        const cls = rosterClassSelect.value;
        if (!cls) return alert('請先選擇或新增一個班別！');
        
        const text = rosterTextArea.value.trim();
        const list = text.split('\n').map(name => name.trim()).filter(name => name.length > 0);
        
        studentRosters[cls] = list;
        localStorage.setItem('studentRosters', JSON.stringify(studentRosters));
        
        alert(`成功儲存 ${cls} 班學生名單（共 ${list.length} 人）！`);
        updateStudentDropdown();
    });

    studentClassInput.addEventListener('change', updateStudentDropdown);

    function updateStudentDropdown() {
        const selectedClass = studentClassInput.value;
        studentNameSelect.innerHTML = '';
        if (!selectedClass) {
            studentNameSelect.innerHTML = '<option value="" disabled selected>請先選擇班別</option>';
            return;
        }
        const classList = studentRosters[selectedClass] || [];
        if (classList.length === 0) {
            studentNameSelect.innerHTML = '<option value="" disabled selected>⚠️ 此班級尚未建立名單</option>';
            return;
        }
        let optionsHtml = '<option value="" disabled selected>請選取學生</option>';
        classList.forEach(student => {
            optionsHtml += `<option value="${escapeHtml(student)}">${escapeHtml(student)}</option>`;
        });
        
        studentNameSelect.innerHTML = optionsHtml;
    }

    // 當發佈表單提交時
    dailyHomeworkForm.addEventListener('submit', function(e) {

        const rawContent = homeworkContentInput.value.trim();
        
        if (!cls) return alert('請先選擇發佈班別！');
        
        // 將家課內容按行分割為陣列，過濾空白行

                                        .map(item => item.trim())
                                        .filter(item => item.length > 0);
        
        // 儲存至資料庫
        const key = `${date}___${cls}`;
        dailyHomeworkDb[key] = homeworkList;
        localStorage.setItem('dailyHomeworkDb', JSON.stringify(dailyHomeworkDb));
        
        // 清空輸入框（保留日期與班別，方便修改）
        homeworkContentInput.value = '';
        
        alert(`🎉 成功儲存及發佈 ${cls} 班於 ${date} 的家課！`);
        
        // 更新當前展示板
        renderDailyHomeworkBoard();
    });

    // 依據列表篩選器連動渲染家課展示板
    function renderDailyHomeworkBoard() {
        // 連動：讀取下方欠交列表的篩選器「班別」，若為 ALL 則預設為班級選單的第一個
        let selectedClass = classFilter.value;
        if (selectedClass === 'ALL') {
            selectedClass = classList[0] || '-';
        }
        
        // 連動：日期與下方登記日期或今天同步
        const selectedDate = recordDateInput.value || today;

        hwDisplayClass.textContent = selectedClass;
        hwDisplayDate.textContent = selectedDate;

        const key = `${selectedDate}___${selectedClass}`;
        const homeworkList = dailyHomeworkDb[key];

        if (!homeworkList || homeworkList.length === 0) {
            noHomeworkMessage.style.display = 'block';
            homeworkDisplayList.style.display = 'none';
            return;
        }

        noHomeworkMessage.style.display = 'none';
        homeworkDisplayList.innerHTML = '';
        
        homeworkList.forEach(item => {
            const li = document.createElement('li');
            li.textContent = item;
            homeworkDisplayList.appendChild(li);
        });
        homeworkDisplayList.style.display = 'ol';
    }

    // 一鍵複製當天家課（方便貼到通訊軟體）
    copyHomeworkBtn.addEventListener('click', function() {
        const selectedClass = hwDisplayClass.textContent;
        const selectedDate = hwDisplayDate.textContent;
        const key = `${selectedDate}___${selectedClass}`;
        const homeworkList = dailyHomeworkDb[key];

        if (!homeworkList || homeworkList.length === 0) {
            return alert('沒有可以複製的家課內容！');
        }

        let copyText = `🏫 聖公會蔡功譜中學\n📚 ${selectedClass} 班 每日家課表\n📅 日期：${selectedDate}\n\n`;
        homeworkList.forEach(item => {
            copyText += `${item}\n`;
        });

        // 複製到剪貼簿
        navigator.clipboard.writeText(copyText).then(() => {
            alert('📋 家課表已複製至剪貼簿，可以直接貼到 WhatsApp 或 Teams 群組！');
        }).catch(err => {
            alert('複製失敗，請手動複製網頁上的家課內容。');
        });
    });

    function autoCleanRecords() {
        const policy = cleanPolicy.value;
        if (policy === 'NEVER') return;
        const daysLimit = parseInt(policy);
        const todayDate = new Date();
        const limitDate = new Date(todayDate.getFullYear(), todayDate.getMonth(), todayDate.getDate() - daysLimit);
        
        const originalLength = records.length;
        
        records = records.filter(record => {
            const recordDate = new Date(record.date);
            return recordDate >= limitDate;
        });
        const deletedCount = originalLength - records.length;
        if (deletedCount > 0) {
            localStorage.setItem('homeworkRecords', JSON.stringify(records));
            cleanedCountSpan.textContent = deletedCount;
            cleanAlert.style.display = 'flex';
            setTimeout(() => {
                cleanAlert.style.display = 'none';
            }, 5000);
        }
    }

    function getFilteredRecords() {
        const selectedClass = classFilter.value;
        const searchQuery = nameSearch.value.trim().toLowerCase();
        return records.filter(record => {
            const matchesClass = (selectedClass === 'ALL' || record.className === selectedClass);
            const matchesName = record.name.toLowerCase().includes(searchQuery);
            return matchesClass && matchesName;
        });
    }

    function renderTable() {
        recordTableBody.innerHTML = '';
        const selectedClass = classFilter.value;
        const searchQuery = nameSearch.value.trim().toLowerCase();
        
        const filteredRecords = getFilteredRecords();
        if (filteredRecords.length === 0) {
            noDataMessage.style.display = 'block';
            totalCountSpan.textContent = '找到 0 筆相關記錄';
            exportBtn.style.display = 'none';
            return;
        }
        noDataMessage.style.display = 'none';
        exportBtn.style.display = 'inline-flex';
        
        let statsText = '';
        if (selectedClass !== 'ALL' && searchQuery !== '') {
            statsText = `${selectedClass} 班中符合「${searchQuery}」的欠交記錄：${filteredRecords.length} 筆`;
        } else if (selectedClass !== 'ALL') {
            statsText = `${selectedClass} 班總計欠交：${filteredRecords.length} 筆`;
        } else if (searchQuery !== '') {
            statsText = `符合「${searchQuery}」的總計欠交：${filteredRecords.length} 筆`;
        } else {
            statsText = `總計欠交：${filteredRecords.length} 筆`;
        }
        totalCountSpan.textContent = statsText;
        const sortedRecords = [...filteredRecords].sort((a, b) => new Date(b.date) - new Date(a.date));
        sortedRecords.forEach((record) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${record.date}</td>
                <td><span class="badge">${escapeHtml(record.className)}</span></td>
                <td><strong>${escapeHtml(record.name)}</strong></td>
                <td>${escapeHtml(record.item)}</td>
                <td>
                    <button class="btn-delete" onclick="deleteRecord('${record.id}')">已補交 / 刪除</button>
                </td>
            `;
            recordTableBody.appendChild(tr);
        });
    }

    function escapeHtml(string) {
        return String(string).replace(/[&<>"']/g, function (s) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s];
        });
    }

    recordForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const newRecord = {
            id: Date.now().toString(),
            date: recordDateInput.value,
            className: studentClassInput.value,
            name: studentNameSelect.value,
            item: homeworkItemInput.value.trim()
        };
        records.push(newRecord);
        localStorage.setItem('homeworkRecords', JSON.stringify(records));
        
        studentNameSelect.value = '';
        homeworkItemInput.value = '';
        renderTable();
    });

    classFilter.addEventListener('change', renderTable);
    nameSearch.addEventListener('input', renderTable);
    cleanPolicy.addEventListener('change', function() {
        localStorage.setItem('homeworkCleanPolicy', cleanPolicy.value);
        autoCleanRecords();
        renderTable();
    });

    window.deleteRecord = function(id) {
        records = records.filter(record => record.id !== id);
        localStorage.setItem('homeworkRecords', JSON.stringify(records));
        renderTable();
    };

    // 匯出 Excel
    exportBtn.addEventListener('click', function() {
        const filteredRecords = getFilteredRecords();
        if (filteredRecords.length === 0) return;
        let csvContent = "\uFEFF登記日期,班別,學生姓名,欠交項目\n";
        filteredRecords.forEach(record => {
            const safeName = `"${record.name.replace(/"/g, '""')}"`;
            const safeItem = `"${record.item.replace(/"/g, '""')}"`;
            csvContent += `${record.date},${record.className},${safeName},${safeItem}\n`;
        });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const exportDate = new Date().toISOString().split('T')[0];
        const selectedClass = classFilter.value;
        const classNameSuffix = selectedClass === 'ALL' ? '所有班級' : `${selectedClass}班`;
        
        link.setAttribute("href", url);
        link.setAttribute("download", `欠交功課報表_${classNameSuffix}_${exportDate}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
