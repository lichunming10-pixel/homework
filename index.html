<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖公會蔡功譜中學 - 學生欠交功課統計系統 (防當機完美版)</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --danger-color: #e06c75;
            --warning-color: #f39c12;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1050px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 24px;
            margin-bottom: 24px;
            position: relative;
        }
        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .form-group {
            flex: 1;
            min-width: 200px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="date"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea {
            height: 120px;
            resize: vertical;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #357abd;
        }
        .filter-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            background: #eef2f7;
            padding: 15px;
            border-radius: 6px;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 240px;
        }
        .filter-group label {
            margin-bottom: 0;
            white-space: nowrap;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            text-align: left;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #eeeeee;
        }
        th {
            background-color: #f8f9fa;
            color: #555;
        }
        .badge {
            background-color: #e1f0fe;
            color: var(--primary-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-action {
            padding: 6px 10px;
            font-size: 13px;
            width: auto;
            border-radius: 4px;
            margin-right: 4px;
            margin-bottom: 4px;
        }
        .btn-resolve { background-color: #28a745; }
        .btn-resolve:hover { background-color: #218838; }
        .btn-undo { background-color: #f39c12; }
        .btn-undo:hover { background-color: #e67e22; }
        .btn-delete { background-color: var(--danger-color); }
        .btn-delete:hover { background-color: #d15a63; }

        .btn-export, .btn-backup, .btn-restore {
            width: auto;
            padding: 8px 16px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-export { background-color: var(--success-color); }
        .btn-export:hover { background-color: #27ae60; }
        .btn-backup { background-color: #9b59b6; }
        .btn-backup:hover { background-color: #8e44ad; }
        .btn-restore { background-color: #34495e; }
        .btn-restore:hover { background-color: #2c3e50; }
        
        .btn-toggle {
            font-size: 14px;
            padding: 8px 16px;
            width: auto;
        }

        .no-data {
            text-align: center;
            color: #888;
            padding: 20px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
            color: #555;
            flex-wrap: wrap;
            gap: 10px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .clean-alert {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 8px;
            border: 1px solid #ffeeba;
        }
        .roster-card {
            background: #f8f9fa;
            border: 1px dashed var(--primary-color);
            display: none;
            margin-top: 15px;
        }
